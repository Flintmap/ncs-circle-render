name: Render
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: render
        run: npm install
      - name: Render
        working-directory: render
        run: node render.js
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: render/output/*.mp4
          retention-days: 1
