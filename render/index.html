    const ff=new FFmpeg();
    const base='https://unpkg.com/@ffmpeg/core@0.12.4/dist/esm';
    await ff.load({coreURL:await toBlobURL(`${base}/ffmpeg-core.js`,'text/javascript'),wasmURL:await toBlobURL(`${base}/ffmpeg-core.wasm`,'application/wasm')});
    return{ff,fetchFile};
  }catch(e){console.warn('ffmpeg.wasm unavailable:',e);return null;}
}

async function startRecording(){
  if(!recC.captureStream){showStatus('captureStream not supported',4000);return;}
  const isVideo = CFG.layout.mode === 'video';
  recording=true;recBtn.textContent='⏹ Stop';recBtn.classList.add('rec');recChunks=[];
  startRecDrawLoop();
  const canvasStream=recC.captureStream(CFG.perf.targetFPS);
  // Video-only capture — no live audio track. Keeping audio out of the
  // real-time encode path means the encoder only ever has to keep up
  // with video, so it can't fall behind/desync the way combined
  // video+audio real-time encoding sometimes did. The original audio
  // file gets sliced and muxed back in after recording stops (see
  // onstop below), using the offset/duration captured here. Green
  // screen mode never gets audio at all, muxed or otherwise.
  const combined=new MediaStream(canvasStream.getVideoTracks());
  recordAudioOffsetSec = currentAudioEl ? currentAudioEl.currentTime : 0;
  recordStartWallTime = performance.now();
  const mimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
  const videoBitsPerSecond = isVideo ? 18_000_000 : 8_000_000;
  mediaRecorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=async()=>{
    stopRecDrawLoop();
    const recordDurationSec = (performance.now() - recordStartWallTime) / 1000;
    const webm=new Blob(recChunks,{type:mime});
    const outName = isVideo ? 'ncs-circle-video.mp4' : 'ncs-circle-greenscreen.mp4';
    showStatus('Loading ffmpeg…');
    const ff=await tryFfmpeg();
    if(ff){
      try{
        const{ff:inst,fetchFile}=ff;
        await inst.writeFile('in.webm',await fetchFile(webm));
        if(isVideo && currentAudioFile){
          // Mux original audio back in, sliced to match how long recording
          // ran and offset by how far into the track recording started
          // (e.g. if you waited 10s after hitting play before hitting
          // record, the muxed audio starts at that same 10s mark).
          // Video mode target: 1920x1080, 18Mbps video / 384kbps audio.
          showStatus('Encoding mp4…');
          const audioName='audio-in'+(currentAudioFile.name.match(/\.[^.]+$/)?.[0]||'.mp3');
          await inst.writeFile(audioName,await fetchFile(currentAudioFile));
          await inst.exec(['-i','in.webm','-ss',String(recordAudioOffsetSec),'-t',String(recordDurationSec),'-i',audioName,
            '-map','0:v','-map','1:a','-c:v','libx264','-preset','fast','-b:v','18M','-c:a','aac','-b:a','384k','-shortest','out.mp4']);
        } else {
          // Green screen mode is always silent, even with a track loaded —
          // and video mode with no track loaded also just has no audio to mux.
          showStatus('Encoding mp4…');
          const vBitrateArgs = isVideo ? ['-b:v','18M'] : ['-crf','18'];
          await inst.exec(['-i','in.webm','-c:v','libx264','-preset','fast',...vBitrateArgs,'-an','out.mp4']);
        }
        const d=await inst.readFile('out.mp4');
        download(new Blob([d.buffer],{type:'video/mp4'}),outName);
        showStatus('Saved as mp4 ✓',4000); return;
      }catch(e){console.warn('ffmpeg encode failed:',e);}
    }
    // ── Fallback: save the video-only recording (no ffmpeg available to mux audio) ──
    download(webm, isVideo ? 'ncs-circle-video.webm' : 'ncs-circle-greenscreen.webm');
    showStatus('Saved as webm (no audio) ✓',4000);
  };
  mediaRecorder.start(100);showStatus('● REC');
}
function stopRecording(){recording=false;recBtn.textContent='⏺ Record';recBtn.classList.remove('rec');showStatus('Processing…');mediaRecorder.stop();}

// ── Locked Render — offline, frame-accurate 60fps render ────────────
// The normal Record button captures whatever the browser actually
// manages to draw in real time; if the GPU/CPU falls behind (e.g. 7fps),
// captureStream() just repeats stale frames to fill the gap, so the
// *output* stutters even though the container says 60fps. Locked Render
// sidesteps that entirely: it renders frame-by-frame with a fixed 1/60s
// virtual clock (however long each frame actually takes in wall time),
// so the encoded video is always genuinely smooth 60fps motion — it may
// just take longer than real-time to finish rendering on a slow machine.
let lockedRendering = false, lockedCancelled = false;
const lockedBtn = document.getElementById('lockedBtn');
let lockedOn = false;
let lockedFPS = 60;
lockedBtn.addEventListener('click', () => {
  if (!lockedOn) { lockedOn = true; lockedFPS = 60; }
  else if (lockedFPS === 60) { lockedFPS = 30; }
  else { lockedOn = false; lockedFPS = 60; }
  lockedBtn.textContent = lockedOn ? `Locked ${lockedFPS}fps ON` : 'Locked 60fps OFF';
  lockedBtn.classList.toggle('on', lockedOn);
});

recBtn.addEventListener('click', () => {
  if (lockedRendering) { lockedCancelled = true; return; } // click during render = cancel
  if (lockedOn) { renderLockedOffline(); return; }
  recording ? stopRecording() : startRecording();
});

// Precompute per-frame audio-reactive values across [offsetSec, offsetSec+durationSec]
// at exactly `fps` steps/sec using OfflineAudioContext's suspend/resume — this
// reproduces the exact same analyser reads getLoudness()/bandRMS() would give
// live, but fully deterministically and decoupled from real playback time.
async function precomputeAudioTrack(file, offsetSec, durationSec, fps){
  // Decode once, then analyze the decoded PCM directly. Do NOT use
  // OfflineAudioContext.suspend()/resume() here: suspend() cannot progress
  // until an OfflineAudioContext is actually rendering, and the old code
  // waited for every suspend before calling startRendering(), which is why
  // the render could appear stuck at "reading MP3" forever.
  const arrayBuffer = await file.arrayBuffer();
  const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await decodeCtx.decodeAudioData(arrayBuffer.slice(0));
  await decodeCtx.close();

  const sampleRate = audioBuffer.sampleRate;
  const channels = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const totalFrames = Math.max(1, Math.ceil(durationSec * fps));
  const loudArr = new Float32Array(totalFrames);
  const bandArr = new Float32Array(totalFrames);
  const ac = CFG.audio;

  // Match the analyser's 2048-sample window, but sample the exact virtual
  // frame time instead of depending on wall-clock playback.
  const windowSize = 2048;
  const half = windowSize >> 1;
  const channelData = [];
  for(let c=0;c<channels;c++) channelData.push(audioBuffer.getChannelData(c));

  for(let i=0;i<totalFrames;i++){
    const center = Math.round((offsetSec + i / fps) * sampleRate);
    const from = Math.max(0, center - half);
    const to = Math.min(length, from + windowSize);
    const n = Math.max(1, to - from);

    let sumSq = 0;
    for(let j=from;j<to;j++){
      let x = 0;
      for(let c=0;c<channels;c++) x += channelData[c][j] || 0;
      x /= channels;
      sumSq += x*x;
    }
    loudArr[i] = Math.sqrt(sumSq / n);

    // Calculate the same broad frequency-band energy used by reactor2,
    // directly from PCM with a small Goertzel-style detector. This avoids
    // constructing/running an offline audio graph for every frame.
    const targetHz = ac.reactor2Freq;
    const widthHz = ac.reactor2Width;
    const lo = Math.max(1, Math.floor((targetHz - widthHz) * n / sampleRate));
    const hi = Math.max(lo, Math.ceil((targetHz + widthHz) * n / sampleRate));
    let bandPower = 0;
    const count = Math.max(1, hi - lo + 1);
    for(let k=lo;k<=hi;k++){
      const omega = 2 * Math.PI * k / n;
      const coeff = 2 * Math.cos(omega);
      let s1=0, s2=0;
      for(let j=from;j<to;j++){
        let x=0;
        for(let c=0;c<channels;c++) x += channelData[c][j] || 0;
        x /= channels;
        const s0 = x + coeff*s1 - s2;
        s2=s1; s1=s0;
      }
      bandPower += Math.max(0, s1*s1 + s2*s2 - coeff*s1*s2);
    }
    bandArr[i] = Math.min(1, Math.sqrt(bandPower / count / n) * 2);

    // Keep the UI responsive without tying rendering speed to real time.
    if((i & 31) === 0) await new Promise(r => setTimeout(r, 0));
  }
  return { loudArr, bandArr };
}

async function renderLockedOffline(){
  if (!currentAudioFile) { showStatus('Load an audio file first', 3000); return; }
  const isVideo = CFG.layout.mode === 'video';
  const fps = lockedFPS;
  const offsetSec = currentAudioEl ? currentAudioEl.currentTime : 0;
  const durationSec = Math.max(0.1, (currentAudioEl?.duration || 0) - offsetSec);
  if (!isFinite(durationSec) || durationSec <= 0.1) { showStatus('Audio has no readable duration', 3000); return; }

  lockedRendering = true; lockedCancelled = false;
  recBtn.textContent = '⏹ Cancel';
  recBtn.classList.add('rec');

  try {
    showStatus('Analyzing audio…');
    const { loudArr, bandArr } = await precomputeAudioTrack(currentAudioFile, offsetSec, durationSec, fps);
    if (lockedCancelled) throw new Error('cancelled');

    sizeRecCanvas();
    const w = recC.width, h = recC.height;
    const videoEncoderTarget = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target: videoEncoderTarget,
      video: { codec: 'avc', width: w, height: h },
      fastStart: 'in-memory',
    });
    const videoEncoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => console.error('VideoEncoder error:', e),
    });
    videoEncoder.configure({
      codec: 'avc1.640034', // H.264 High @ L5.2 — safe for 1080p+/high bitrate
      width: w, height: h,
      bitrate: isVideo ? 18_000_000 : 8_000_000,
      framerate: fps,
    });

    const ac = CFG.audio;
    const state = { radius: null, displace: 0, finalAudio: 0 };
    const totalFrames = loudArr.length;
    const frameDur = 1e6 / fps; // microseconds

    for (let i = 0; i < totalFrames; i++){
      if (lockedCancelled) throw new Error('cancelled');
      const loud = loudArr[i];
      const displaceLoud = ac.reactor2Mode === 2 ? bandArr[i] : loud;
      const targets = ac.enabled
        ? computeReactorTargets(ac, loud, displaceLoud)
        : { targetRadius: ac.reactor1RadiusMin, targetDisplace: 0, targetReactor: 0 };
      stepReactorSmoothing(state, ac, targets);

      const R = state.radius, D = state.displace, FA = state.finalAudio, RA = state.radius - CFG.sphereR;
      const virtualElapsed = i / fps;
      drawFrame(R, D, FA, RA, virtualElapsed);

      // WebGL rendering is asynchronous on many phones. Finish it before
      // compositing/capturing, otherwise the encoder can receive a blank
      // or stale frame.
      if (gl && gl.finish) gl.finish();

      renderExportFrame(recCtx, w, h);

      // Force the 2D canvas to commit the composited pixels.
      const firstPixel = recCtx.getImageData(0, 0, 1, 1).data;
      if (i === 0 && firstPixel[3] === 0) {
        console.warn('First export frame is fully transparent; checking WebGL/export pipeline.');
      }

      // Snapshot the actual rendered canvas. ImageBitmap is deliberately used
      // here instead of passing the canvas directly to VideoFrame, because
      // some mobile browsers otherwise race the canvas update and encode an
      // empty frame.
      const bitmap = await createImageBitmap(recC);
      const frame = new VideoFrame(bitmap, {
        timestamp: Math.round(i * frameDur),
        duration: Math.round(frameDur)
      });
      videoEncoder.encode(frame, { keyFrame: i % 150 === 0 });
      frame.close();
      bitmap.close();

      // Do not enqueue thousands of frames into VideoEncoder at once.
      // On mobile this can cause huge memory pressure and make the encoder
      // appear to run at ~2 FPS even though the render loop itself is fine.
      while (videoEncoder.encodeQueueSize > 8) {
        await new Promise(r => setTimeout(r, 0));
      }

      if (i % 30 === 0) {
        showStatus(`Rendering frame ${i + 1}/${totalFrames}…`);
        await new Promise(r => setTimeout(r, 0)); // yield so the status text/UI actually paints
      }
    }

    await videoEncoder.flush();
    muxer.finalize();
    const videoOnlyBlob = new Blob([videoEncoderTarget.buffer], { type: 'video/mp4' });

    // Mux the sliced original audio onto the deterministic video — same
    // offset/duration used for the audio precompute above, so they line up.
    const outName = isVideo ? 'ncs-circle-video-locked.mp4' : 'ncs-circle-greenscreen-locked.mp4';
    showStatus('Muxing audio…');
    const ff = await tryFfmpeg();
    if (ff && isVideo) {
      try {
        const { ff: inst, fetchFile } = ff;
        await inst.writeFile('in.mp4', await fetchFile(videoOnlyBlob));
        const audioName = 'audio-in' + (currentAudioFile.name.match(/\.[^.]+$/)?.[0] || '.mp3');
        await inst.writeFile(audioName, await fetchFile(currentAudioFile));
        await inst.exec(['-i', 'in.mp4', '-ss', String(offsetSec), '-t', String(durationSec), '-i', audioName,
          '-map', '0:v', '-map', '1:a', '-c:v', 'copy', '-c:a', 'aac', '-b:a', '384k', '-shortest', 'out.mp4']);
        const d = await inst.readFile('out.mp4');
        download(new Blob([d.buffer], { type: 'video/mp4' }), outName);
        showStatus('Saved as mp4 ✓', 4000);
      } catch (e) {
        console.warn('locked-render audio mux failed:', e);
        download(videoOnlyBlob, outName.replace('.mp4', '-silent.mp4'));
        showStatus('Saved (audio mux failed, silent) ✓', 4000);
      }
    } else {
      // Green screen mode is always silent by design; also the fallback
      // path if ffmpeg itself is unavailable.
      download(videoOnlyBlob, outName);
      showStatus('Saved as mp4 ✓', 4000);
    }
  } catch (e) {
    if (e.message === 'cancelled') showStatus('Locked render cancelled', 3000);
    else { console.error('Locked render failed:', e); showStatus('Locked render failed — see console', 4000); }
  } finally {
    lockedRendering = false;
    lastFrameTime = null; // resync the live loop's delta timer after the pause
    recBtn.textContent = '⏺ Record';
    recBtn.classList.remove('rec');
  }
}

// ── Timing ────────────────────────────────────────────────────
const cosRx = Math.cos(CFG.rotX), sinRx = Math.sin(CFG.rotX);
const targetInterval = 1000 / CFG.perf.targetFPS;
let lastFrameTime = null, elapsed = 0, fpsSampleStart = null, fpsSampleCount = 0;
const fpsEl = document.getElementById('fps');

// ── Main loop ─────────────────────────────────────────────────
// Sets all uniforms, draws the point cloud, and composites onto `out`
// (with glow). Used by the live loop() below and by the offline
// "Locked Render" path so both produce pixel-identical frames for the
// same (R, D, FA, RA, timeElapsed) inputs.
function drawFrame(R, D, FA, RA, timeElapsed){
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform1f(U.uGX, GX); gl.uniform1f(U.uGY, GY); gl.uniform1f(U.uGZ, GZ);
  gl.uniform1f(U.uSX, CFG.sizeX); gl.uniform1f(U.uSY, CFG.sizeY); gl.uniform1f(U.uSZ, CFG.sizeZ);
  gl.uniform1f(U.uSphR, R);
  gl.uniform1f(U.uSphS, 1.0);
  gl.uniform1f(U.uFeat, CFG.feather);
  gl.uniform1f(U.uDspAmt, D);
  gl.uniform1f(U.uDspScl, CFG.displace.scale);
  gl.uniform1f(U.uTime, timeElapsed * CFG.displace.speed);
  gl.uniform1f(U.uDspOn, CFG.displace.enabled ? 1.0 : 0.0);
  gl.uniform1f(U.uDspSign, CFG.displace.positiveSign ? 1.0 : -1.0);
  gl.uniform1f(U.uFlowX, CFG.displace.flowX);
  gl.uniform1f(U.uFlowY, CFG.displace.flowY);
  gl.uniform1f(U.uFlowEvo, CFG.displace.flowEvolution);
  gl.uniform1f(U.uNoiseOffX, CFG.displace.noiseOffsetX);
  gl.uniform1f(U.uNoiseOffY, CFG.displace.noiseOffsetY);
  gl.uniform1f(U.uFlipX, CFG.displace.flipX ? 1.0 : 0.0);
  gl.uniform1f(U.uFlipY, CFG.displace.flipY ? 1.0 : 0.0);
  gl.uniform1f(U.uFractalSum, CFG.displace.fractalSum === 'absNoise' ? 1.0 : 0.0);
  gl.uniform1f(U.uOffsetEvo, CFG.displace.offsetEvolution);
  gl.uniform1f(U.uOctMult, CFG.displace.octaveMult);
  gl.uniform1f(U.uOctScl, CFG.displace.octaveScale);
  gl.uniform1i(U.uComplexity, CFG.displace.complexity);
  gl.uniform1f(U.uAffectSize, CFG.displace.affectSize);
  gl.uniform1f(U.uAffectOpacity, CFG.displace.affectOpacity);
  gl.uniform1f(U.uBasePtSize, CFG.ptSize);
  gl.uniform1f(U.uGamma, CFG.displace.gamma);
  gl.uniform1f(U.uNoiseMult, CFG.displace.noiseMultiplier);
  gl.uniform1f(U.uOffset, CFG.displace.offset);
  gl.uniform1f(U.uMinVal, CFG.displace.minVal);
  gl.uniform1f(U.uMaxVal, CFG.displace.maxVal);
  gl.uniform1f(U.uFinalAudio, FA);   // setAudio() result, CPU-computed
  gl.uniform1f(U.uRadiusAudio, RA);  // audioRadius → sphere radius delta
  gl.uniform1f(U.uBlendInt, CFG.blend.intensity);
  gl.uniform1f(U.uBlendViaGrid, CFG.blend.blendViaGrid ? 1.0 : 0.0);
  gl.uniform1f(U.uBlendOn, CFG.blend.enabled ? 1.0 : 0.0);
  gl.uniform1f(U.uCam, CFG.camera);
  gl.uniform1f(U.uCRx, cosRx); gl.uniform1f(U.uSRx, sinRx);
  gl.uniform1f(U.uCamOX, CFG.camOX || 0);
  gl.uniform1f(U.uCamOY, CFG.camOY || 0);
  gl.uniform1f(U.uZoom, CFG.zoom || 1.0);
  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform1f(U.uAlpha, CFG.alpha);
  gl.uniform3f(U.uCol, colR/255, colG/255, colB/255);

  // ── WebGL draw — premultiplied "over" blending (color is already
  // premultiplied by alpha in the fragment shader, so ONE/ONE_MINUS_SRC_ALPHA
  // correctly accumulates both color and alpha together)
  if (CFG.blend.enabled) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disable(gl.BLEND);
  } else {
    gl.drawArrays(gl.POINTS, 0, N);
  }

  // ── Composite to output canvas
  // transparent background — no black fill so it can be used over any bg
  ctx.clearRect(0, 0, out.width, out.height);
  // draw the WebGL frame directly without color tinting (tint is baked into uCol)
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1.0;
  ctx.drawImage(glc, 0, 0);

  if (CFG.glow.enabled) {
    const g = CFG.glow;
    glowCtx.clearRect(0, 0, glowC.width, glowC.height);
    glowCtx.drawImage(out, 0, 0, glowC.width, glowC.height);
    ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=g.strength/10; ctx.filter=`blur(${g.radius}px)`; ctx.drawImage(glowC,0,0,out.width,out.height); ctx.restore();
    ctx.filter = 'none';
  }
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (lockedRendering) return; // paused while an offline Locked Render is in progress
  updateAudio();
  if (lastFrameTime === null) { lastFrameTime = ts; fpsSampleStart = ts; return; }
  const delta = ts - lastFrameTime;
  lastFrameTime = ts;
  elapsed += delta * 0.001;

  fpsSampleCount++;
  if (ts - fpsSampleStart >= 700) {
    fpsEl.textContent = Math.round(fpsSampleCount / ((ts - fpsSampleStart) / 1000)) + ' fps';
    fpsSampleCount = 0; fpsSampleStart = ts;
  }

  const R = analyser ? (smoothRadius !== null ? smoothRadius : CFG.sphereR) : CFG.sphereR;
  const D = analyser ? smoothDisplace : 0;
  const FA = analyser ? smoothFinalAudio : 0;
  const RA = analyser ? (smoothRadius !== null ? smoothRadius - CFG.sphereR : 0) : 0;

  drawFrame(R, D, FA, RA, elapsed);

  // Live preview of the export composite (background/logo/circle layout) —
  // doesn't affect the fullscreen interactive circle above.
  renderExportFrame(prevCtx, prevC.width, prevC.height);

  // Big live WYSIWYG view. Skipped while actually recording/rendering —
  // it's just a monitor view, and competing with the recording draw loop
  // for canvas/GPU time is what tanks recorded fps on slower devices.
  if (fsActive && !recording && !lockedRendering) renderFullscreenFrame(fsCtx, fsCanvas.width);
}
requestAnimationFrame(loop);

// ══════════════════════════════════════════════════════════════════
// GitHub Actions Render — offload the deterministic locked-render path
// (renderLockedOffline) to a GitHub Actions runner via Puppeteer, so it
// can finish without tying up this device. See ghRenderStart() for the
// main flow. Everything below is additive; it never runs unless the
// GitHub Render panel is used, or ?ghHeadless=1 is present (which only
// happens inside the Actions runner itself).
// ══════════════════════════════════════════════════════════════════

function ghSetStatus(msg){ const el = document.getElementById('ghStatus'); if (el) el.textContent = msg; }

function b64(str){ return btoa(unescape(encodeURIComponent(str))); }

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function ghCanvasFromImage(img){
  return new Promise((resolve) => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth || img.width;
    c.height = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(resolve, 'image/png');
  });
}

// Strips non-serializable bits (loaded Image objects, functions) out of
// CFG before it's JSON-uploaded as the render job's config snapshot.
function ghSerializeCFG(obj){
  if (obj === null || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(ghSerializeCFG);
  const out = {};
  for (const k in obj) {
    if (k === 'img') continue;
    const v = obj[k];
    if (typeof v === 'function') continue;
    out[k] = ghSerializeCFG(v);
  }
  return out;
}

// Applies an uploaded config snapshot back onto the live CFG object
// (used only in the headless bootstrap below), key-by-key so object
// identity/structure CFG already relies on elsewhere stays intact.
function ghDeepMergeCFG(target, source){
  for (const k in source) {
    if (k === 'img') continue;
    const sv = source[k];
    if (sv && typeof sv === 'object' && !Array.isArray(sv) && target[k] && typeof target[k] === 'object') {
      ghDeepMergeCFG(target[k], sv);
    } else {
      target[k] = sv;
    }
  }
}

function ghHeaders(token){
  return { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}

async function ghUser(token){
  const r = await fetch('https://api.github.com/user', { headers: ghHeaders(token) });
  if (!r.ok) throw new Error('Bad token (' + r.status + ') — check it has "repo" and "workflow" scopes.');
  return r.json();
}

async function ghEnsureRepo(token, owner, repo){
  let r = await fetch('https://api.github.com/repos/' + owner + '/' + repo, { headers: ghHeaders(token) });
  if (r.status === 404) {
    r = await fetch('https://api.github.com/user/repos', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
      body: JSON.stringify({ name: repo, private: false, auto_init: true, description: 'Auto-created by ncs-circle GitHub Render' })
    });
    if (!r.ok) throw new Error('Repo create failed: ' + (await r.text()));
    await new Promise(res => setTimeout(res, 3000)); // let GitHub finish provisioning the default branch
  } else if (!r.ok) {
    throw new Error('Repo check failed: ' + (await r.text()));
  }
}

async function ghPutFile(token, owner, repo, path, base64Content, message){
  let sha;
  const getR = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, { headers: ghHeaders(token) });
  if (getR.ok) { const j = await getR.json(); sha = j.sha; }
  const body = { message: message, content: base64Content };
  if (sha) body.sha = sha;
  const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Push failed for ' + path + ': ' + (await r.text()));
  return r.json();
}

async function ghTriggerWorkflow(token, owner, repo, defaultBranch){
  const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/workflows/render.yml/dispatches', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
    body: JSON.stringify({ ref: defaultBranch })
  });
  if (!r.ok) throw new Error('Trigger failed: ' + (await r.text()));
}

async function ghGetLatestRun(token, owner, repo, sinceISO){
  const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/workflows/render.yml/runs?per_page=5', { headers: ghHeaders(token) });
  if (!r.ok) throw new Error('Run list failed: ' + (await r.text()));
  const j = await r.json();
  return j.workflow_runs.find(run => new Date(run.created_at) >= new Date(sinceISO)) || null;
}

async function ghPollRun(token, owner, repo, runId, onProgress){
  while (true) {
    const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/runs/' + runId, { headers: ghHeaders(token) });
    const j = await r.json();
    onProgress(j.status, j.conclusion);
    if (j.status === 'completed') return j;
    await new Promise(res => setTimeout(res, 8000));
  }
}

async function ghDownloadArtifactZip(token, owner, repo, runId){
  const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/runs/' + runId + '/artifacts', { headers: ghHeaders(token) });
  const j = await r.json();
  const art = (j.artifacts || []).find(a => a.name === 'rendered-video');
  if (!art) throw new Error('No artifact found — open the Actions tab on GitHub to see what happened.');
  const zr = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/artifacts/' + art.id + '/zip', { headers: ghHeaders(token) });
  if (!zr.ok) throw new Error('Artifact download failed: ' + zr.status);
  return zr.blob();
}

function ghLoadJSZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => resolve(window.JSZip);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ── Files pushed into the render repo. These are static — they only
// ever change when this HTML file is edited — so they get overwritten
// on every render, which keeps the repo self-healing if something in
// there gets manually edited/broken.
const GH_WORKFLOW_YML =
'name: Render\n' +
'on:\n' +
'  workflow_dispatch:\n' +
'jobs:\n' +
'  render:\n' +
'    runs-on: ubuntu-latest\n' +
'    timeout-minutes: 60\n' +
'    steps:\n' +
'      - uses: actions/checkout@v4\n' +
'      - uses: actions/setup-node@v4\n' +
'        with:\n' +
'          node-version: 20\n' +
'      - name: Install deps\n' +
'        working-directory: render\n' +
'        run: npm install\n' +
'      - name: Render\n' +
'        working-directory: render\n' +
'        run: node render.js\n' +
'      - name: Upload result\n' +
'        uses: actions/upload-artifact@v4\n' +
'        with:\n' +
'          name: rendered-video\n' +
'          path: render/output/*.mp4\n' +
'          retention-days: 1\n';

const GH_PACKAGE_JSON = JSON.stringify({
  name: 'render', private: true, dependencies: { puppeteer: '^23.0.0' }
}, null, 2);

const GH_RENDER_JS =
"const puppeteer = require('puppeteer');\n" +
"const fs = require('fs');\n" +
"const path = require('path');\n" +
"\n" +
"(async () => {\n" +
"  const outDir = path.join(__dirname, 'output');\n" +
"  fs.mkdirSync(outDir, { recursive: true });\n" +
"\n" +
"  const browser = await puppeteer.launch({\n" +
"    headless: 'new',\n" +
"    args: ['--no-sandbox', '--disable-setuid-sandbox', '--use-gl=swiftshader', '--enable-unsafe-swiftshader', '--autoplay-policy=no-user-gesture-required']\n" +
"  });\n" +
"  const page = await browser.newPage();\n" +
"  await page.setViewport({ width: 1920, height: 1080 });\n" +
"  page.on('console', msg => console.log('[page]', msg.text()));\n" +
"  page.on('pageerror', err => console.error('[page error]', err));\n" +
"\n" +
"  let done = false, failed = null;\n" +
"  await page.exposeFunction('__ghSaveFile', async (base64, name) => {\n" +
"    fs.writeFileSync(path.join(outDir, name), Buffer.from(base64, 'base64'));\n" +
"    done = true;\n" +
"  });\n" +
"  await page.exposeFunction('__ghFail', (msg) => { failed = msg; done = true; });\n" +
"\n" +
"  const indexPath = 'file://' + path.join(__dirname, 'index.html') + '?ghHeadless=1';\n" +
"  await page.goto(indexPath, { waitUntil: 'load', timeout: 60000 });\n" +
"\n" +
"  const start = Date.now();\n" +
"  const timeoutMs = 55 * 60 * 1000;\n" +
"  while (!done) {\n" +
"    if (Date.now() - start > timeoutMs) throw new Error('Render timed out');\n" +
"    await new Promise(r => setTimeout(r, 2000));\n" +
"  }\n" +
"\n" +
"  await browser.close();\n" +
"  if (failed) { console.error('Render failed:', failed); process.exit(1); }\n" +
"  console.log('Render complete.');\n" +
"})().catch(e => { console.error(e); process.exit(1); });\n";

async function ghRenderStart(){
  const tokenEl = document.getElementById('ghToken');
  const repoEl = document.getElementById('ghRepo');
  const token = tokenEl.value.trim();
  const repo = repoEl.value.trim();
  const startBtn = document.getElementById('ghStartBtn');
  const dlBtn = document.getElementById('ghDownloadBtn');
  if (!token || !repo) { ghSetStatus('Enter a token and repo name.'); return; }
  if (!currentAudioFile) { ghSetStatus('Load an audio file first (this device only needs to hold it, not render it).'); return; }

  localStorage.setItem('ghToken', token);
  localStorage.setItem('ghRepo', repo);
  startBtn.disabled = true;
  dlBtn.style.display = 'none';

  try {
    ghSetStatus('Checking token…');
    const user = await ghUser(token);
    const owner = user.login;

    ghSetStatus('Ensuring repo exists…');
    await ghEnsureRepo(token, owner, repo);
    const repoInfoR = await fetch('https://api.github.com/repos/' + owner + '/' + repo, { headers: ghHeaders(token) });
    const repoInfo = await repoInfoR.json();
    const defaultBranch = repoInfo.default_branch || 'main';

    ghSetStatus('Pushing render pipeline…');
    await ghPutFile(token, owner, repo, '.github/workflows/render.yml', b64(GH_WORKFLOW_YML), 'Update render workflow');
    await ghPutFile(token, owner, repo, 'render/package.json', b64(GH_PACKAGE_JSON), 'Update render deps');
    await ghPutFile(token, owner, repo, 'render/render.js', b64(GH_RENDER_JS), 'Update render driver');

    ghSetStatus('Pushing page snapshot…');
    const pageSource = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    await ghPutFile(token, owner, repo, 'render/index.html', b64(pageSource), 'Update page snapshot');

    ghSetStatus('Uploading audio…');
    const audioExt = (currentAudioFile.name.match(/\.[^.]+$/) || ['.mp3'])[0];
    await ghPutFile(token, owner, repo, 'render/job/audio' + audioExt, await blobToBase64(currentAudioFile), 'Upload audio');

    const hasBg = !!(CFG.layout.bg && CFG.layout.bg.img);
    const hasLogo = !!(CFG.layout.logo && CFG.layout.logo.img);

    if (hasBg) {
      ghSetStatus('Uploading background…');
      const bgBlob = await ghCanvasFromImage(CFG.layout.bg.img);
      await ghPutFile(token, owner, repo, 'render/job/bg.png', await blobToBase64(bgBlob), 'Upload bg');
    }
    if (hasLogo) {
      ghSetStatus('Uploading logo…');
      const logoBlob = await ghCanvasFromImage(CFG.layout.logo.img);
      await ghPutFile(token, owner, repo, 'render/job/logo.png', await blobToBase64(logoBlob), 'Upload logo');
    }

    const jobConfig = {
      audioExt: audioExt,
      lockedFPS: (typeof lockedFPS !== 'undefined' ? lockedFPS : 60),
      hasBg: hasBg,
      hasLogo: hasLogo,
      colR: colR, colG: colG, colB: colB,
      cfg: ghSerializeCFG(CFG)
    };
    ghSetStatus('Uploading config…');
    await ghPutFile(token, owner, repo, 'render/job/config.json', b64(JSON.stringify(jobConfig)), 'Upload config');

    ghSetStatus('Triggering GitHub Actions…');
    const sinceISO = new Date(Date.now() - 5000).toISOString();
    await ghTriggerWorkflow(token, owner, repo, defaultBranch);

    ghSetStatus('Waiting for the run to start…');
    let run = null;
    for (let i = 0; i < 15; i++) {
      run = await ghGetLatestRun(token, owner, repo, sinceISO);
      if (run) break;
      await new Promise(r => setTimeout(r, 3000));
    }
    if (!run) throw new Error('Could not find the triggered run — check the Actions tab on GitHub manually.');

    const finished = await ghPollRun(token, owner, repo, run.id, (status) => {
      ghSetStatus('Rendering on GitHub… (' + status + ')');
    });

    if (finished.conclusion !== 'success') {
      throw new Error('Run finished as "' + finished.conclusion + '" — check the Actions log on GitHub: ' + run.html_url);
    }

    ghSetStatus('Fetching finished video…');
    const zipBlob = await ghDownloadArtifactZip(token, owner, repo, run.id);
    const JSZipLib = await ghLoadJSZip();
    const zip = await JSZipLib.loadAsync(zipBlob);
    const mp4Name = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.mp4'));
    if (!mp4Name) throw new Error('No mp4 found inside the artifact.');
    const mp4Blob = await zip.files[mp4Name].async('blob');

    ghSetStatus('Done ✓ (~' + Math.round(mp4Blob.size / 1e6) + 'MB)');
    dlBtn.style.display = 'block';
    dlBtn.onclick = () => download(mp4Blob, mp4Name.replace(/^.*\//, ''));
  } catch (e) {
    console.error('GitHub render failed:', e);
    ghSetStatus('Failed: ' + e.message);
  } finally {
    startBtn.disabled = false;
  }
}

// ── Panel wiring ──────────────────────────────────────────────────
(function ghInitPanel(){
  const panel = document.getElementById('ghPanel');
  document.getElementById('ghOpenBtn').addEventListener('click', () => { panel.style.display = 'block'; });
  document.getElementById('ghCloseBtn').addEventListener('click', () => { panel.style.display = 'none'; });
  document.getElementById('ghStartBtn').addEventListener('click', ghRenderStart);
  try {
    const savedToken = localStorage.getItem('ghToken');
    const savedRepo = localStorage.getItem('ghRepo');
    if (savedToken) document.getElementById('ghToken').value = savedToken;
    if (savedRepo) document.getElementById('ghRepo').value = savedRepo;
  } catch (e) {}
})();

// ══════════════════════════════════════════════════════════════════
// Headless bootstrap — only runs inside the Puppeteer tab GitHub
// Actions launches (render/index.html?ghHeadless=1). Fetches the job
// files committed alongside this page, feeds them through the exact
// same applyAudioFile/applyBgFile/applyLogoFile paths the manual file
// pickers use, then drives the existing deterministic renderLockedOffline().
// ══════════════════════════════════════════════════════════════════
(async function ghHeadlessBootstrap(){
  if (new URLSearchParams(location.search).get('ghHeadless') !== '1') return;
  window.__ghHeadless = true;
  window.__ghHandleOutput = async (blob, name) => {
    const buf = await blob.arrayBuffer();
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    await window.__ghSaveFile(btoa(binary), name);
  };

  try {
    const configResp = await fetch('job/config.json');
    const jobConfig = await configResp.json();

    ghDeepMergeCFG(CFG, jobConfig.cfg);
    if (typeof jobConfig.colR === 'number') { colR = jobConfig.colR; colG = jobConfig.colG; colB = jobConfig.colB; }

    const audioResp = await fetch('job/audio' + jobConfig.audioExt);
    const audioBlob = await audioResp.blob();
    const audioFile = new File([audioBlob], 'audio' + jobConfig.audioExt, { type: audioBlob.type });
    await applyAudioFile(audioFile, true);

    if (jobConfig.hasBg) {
      const bgResp = await fetch('job/bg.png');
      const bgFile = new File([await bgResp.blob()], 'bg.png', { type: 'image/png' });
      await applyBgFile(bgFile);
    }
    if (jobConfig.hasLogo) {
      const logoResp = await fetch('job/logo.png');
      const logoFile = new File([await logoResp.blob()], 'logo.png', { type: 'image/png' });
      await applyLogoFile(logoFile);
    }

    lockedOn = true;
    lockedFPS = jobConfig.lockedFPS || 60;

    await new Promise(r => requestAnimationFrame(r));
    await renderLockedOffline();
  } catch (e) {
    console.error('Headless render failed:', e);
    if (window.__ghFail) window.__ghFail(String(e && e.message || e));
  }
})();
