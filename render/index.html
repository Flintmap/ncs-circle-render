<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCS Circle — Local</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#glc{position:fixed;inset:0;width:100%;height:100%;visibility:hidden}
#out{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ui button{background:#111;color:#fff;border:1px solid #333;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s}
#ui button.dim{background:#0a0a0a;color:#555;border-color:#222}
#ui button.rec{background:#500;border-color:#900;color:#f88}
#ui button.on{background:#050;border-color:#090;color:#8f8}
#cp{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 8px;transition:transform .25s;min-width:58px}
#cp.slide-hidden{transform:translateY(-50%) translateX(-140%)}
#cp2{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:stretch;gap:6px;background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 10px;transition:transform .25s;width:200px;max-height:88vh;overflow-y:auto}
#cp2.slide-hidden{transform:translateY(-50%) translateX(140%)}
.slide-tab{position:fixed;top:50%;transform:translateY(-50%);z-index:11;background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.1);color:#888;font-size:12px;padding:14px 4px;border-radius:8px;cursor:pointer;user-select:none;transition:left .25s,right .25s}
#cpTab{left:80px;border-radius:0 8px 8px 0}
#cp.slide-hidden ~ #cpTab{left:0}
#cp2Tab{right:222px;border-radius:8px 0 0 8px}
#cp2.slide-hidden ~ #cp2Tab{right:0}
#cp2 .sec-hdr span{color:#666;font-size:10px;font-family:sans-serif;text-transform:uppercase;letter-spacing:.5px}
#cp2 label{color:#555;font-size:9px;font-family:sans-serif;display:flex;justify-content:space-between;margin-top:4px}
#cp2 input[type=range]{width:100%}
#cp2 select,#cp2 button.p{width:100%;background:#111;color:#ccc;border:1px solid #333;padding:5px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:3px}
#cp2 .row2{display:flex;gap:4px}
#cp2 .row2 button.p{flex:1}
#prevC{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
#cp2 .divider{width:100%;height:1px;background:rgba(255,255,255,.07);margin:3px 0}
#csw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2);flex-shrink:0;cursor:pointer}
.cp-section{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.cp-section.hidden{display:none}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;user-select:none}
.sec-hdr span{color:#555;font-size:9px;font-family:sans-serif;text-transform:uppercase;letter-spacing:.5px}
.sec-hdr .tog{color:#444;font-size:10px;line-height:1}
#hsl{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:24px;height:100px;cursor:pointer;outline:none;border:none;background:linear-gradient(to bottom,hsl(0,100%,55%),hsl(40,100%,55%),hsl(60,100%,55%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,60%),hsl(280,100%,60%),hsl(320,100%,55%),hsl(360,100%,55%));border-radius:6px}
#brt{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:24px;height:65px;cursor:pointer;outline:none;border:none;background:linear-gradient(to bottom,#fff,#888,#111);border-radius:6px}
#wh{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.3);cursor:pointer}
.pal-grid{display:grid;grid-template-columns:repeat(2,22px);gap:4px}
.pal-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:transform .1s,border-color .1s}
.pal-swatch:hover,.pal-swatch.active{transform:scale(1.15);border-color:rgba(255,255,255,.6)}
.divider{width:100%;height:1px;background:rgba(255,255,255,.07);margin:1px 0}
#fps{position:fixed;top:8px;left:8px;z-index:10;color:rgba(255,255,255,.35);font-size:11px;font-family:monospace;pointer-events:none}
#fsBtn{position:fixed;top:40px;left:16px;z-index:12;background:#111;color:#fff;border:1px solid #333;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s}
#fsBtn:hover{background:#1a1a1a}
#fsBtn.hide{display:none}
#fsWrap{position:fixed;inset:0;width:100%;height:100%;background:#000;display:none;align-items:center;justify-content:center;z-index:9999}
#fsWrap.active{display:flex}
#fsCanvas{background:#000;display:block}
#recStatus{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;color:#f88;font-size:11px;font-family:monospace;pointer-events:none;opacity:0;transition:opacity .3s}
</style>
</head>
<body>

<canvas id="glc" width="800" height="1572" style="width: 400px; height: 786px;"></canvas>
<canvas id="out" width="800" height="1572" style="width: 400px; height: 786px;"></canvas>

<button id="fsBtn" title="Fullscreen live preview">⛶ Fullscreen</button>
<div id="fsWrap">
  <canvas id="fsCanvas" width="400" height="400" style="width: 400px; height: 400px;"></canvas>
</div>

<div id="ui">
  <input type="file" id="fin" accept="audio/*" style="display:none">
  <button onclick="document.getElementById('fin').click()">Choose Audio</button>
  <button id="blendBtn">Blend ON</button>
  <button id="recBtn">⏺ Record</button>
  <button id="lockedBtn" class="on">Locked 60fps ON</button>
  <button id="autoRecBtn">Auto-Rec OFF</button>
  <button id="ghOpenBtn">☁ GitHub Render</button>
</div>

<div id="ghPanel" style="display: block; position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(10, 10, 10, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 16px; width: 300px; font-family: sans-serif; color: rgb(204, 204, 204);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <strong style="font-size:13px;color:#eee;">GitHub Render</strong>
    <span id="ghCloseBtn" style="cursor:pointer;color:#888;font-size:16px;line-height:1;">×</span>
  </div>
  <div style="font-size:10px;color:#777;margin-bottom:10px;line-height:1.4;">
    Renders on GitHub Actions instead of this device. Your token is stored only in this browser's localStorage and sent directly to api.github.com — never to anyone else.
  </div>
  <label style="font-size:10px;color:#555;display:block;margin-top:4px;">GitHub Personal Access Token</label>
  <input id="ghToken" type="password" placeholder="ghp_..." style="width:100%;background:#111;color:#ccc;border:1px solid #333;padding:6px;border-radius:6px;font-size:11px;margin-top:3px;box-sizing:border-box;">
  <label style="font-size:10px;color:#555;display:block;margin-top:8px;">Repo name</label>
  <input id="ghRepo" type="text" value="ncs-circle-render" style="width:100%;background:#111;color:#ccc;border:1px solid #333;padding:6px;border-radius:6px;font-size:11px;margin-top:3px;box-sizing:border-box;">
  <button id="ghStartBtn" class="p" style="width:100%;background:#111;color:#ccc;border:1px solid #333;padding:7px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:12px;" disabled="">⚡ Render on GitHub</button>
  <div id="ghStatus" style="font-size:10px;color:#8cf;margin-top:8px;min-height:14px;line-height:1.4;word-break:break-word;">Pushing page snapshot…</div>
  <button id="ghDownloadBtn" class="p" style="display:none;width:100%;background:#050;color:#8f8;border:1px solid #090;padding:7px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:8px;">⬇ Download Result</button>
</div>

<div id="cp">
  <div id="csw" style="background: rgb(242, 242, 242);"></div>
  <div class="divider"></div>

  <div class="cp-section" id="sec-hue">
    <div class="sec-hdr" onclick="toggleSec('hue')">
      <span>Hue</span><span class="tog">−</span>
    </div>
    <div class="sec-body">
      <input type="range" id="hsl" min="0" max="360" value="60" step="1">
    </div>
  </div>

  <div class="cp-section" id="sec-brt">
    <div class="sec-hdr" onclick="toggleSec('brt')">
      <span>Bright</span><span class="tog">−</span>
    </div>
    <div class="sec-body">
      <input type="range" id="brt" min="0" max="95" value="50" step="1">
      <div id="wh" onclick="setWhite()" title="White" style="margin:4px auto 0"></div>
    </div>
  </div>

  <div class="cp-section" id="sec-pal">
    <div class="sec-hdr" onclick="toggleSec('pal')">
      <span>Palette</span><span class="tog">−</span>
    </div>
    <div class="sec-body">
      <div class="pal-grid" id="palettes"><div class="pal-swatch" title="Yellow" style="background: rgb(230, 230, 26);"></div><div class="pal-swatch" title="Cyan" style="background: rgb(26, 195, 230);"></div><div class="pal-swatch" title="Blue" style="background: rgb(48, 110, 232);"></div><div class="pal-swatch" title="LtGreen" style="background: rgb(94, 230, 26);"></div><div class="pal-swatch" title="Green" style="background: rgb(20, 184, 48);"></div><div class="pal-swatch" title="DkBlue" style="background: rgb(20, 20, 184);"></div><div class="pal-swatch" title="Red" style="background: rgb(230, 26, 26);"></div><div class="pal-swatch" title="Purple" style="background: rgb(162, 26, 230);"></div><div class="pal-swatch" title="Orange" style="background: rgb(230, 128, 26);"></div><div class="pal-swatch active" title="White" style="background: rgb(242, 242, 242);"></div><div class="pal-swatch" title="Black" style="background: rgb(20, 20, 20);"></div></div>
    </div>
  </div>
</div>
<div id="cpTab" class="slide-tab" onclick="toggleCp()">⟨</div>

<div id="cp2" class="">
  <canvas id="prevC" width="178" height="100" style="aspect-ratio: 16 / 9;"></canvas>
  <div class="divider"></div>

  <div class="cp-section" id="sec-mode">
    <div class="sec-hdr" onclick="toggleSec2('mode')"><span>Export Mode</span><span class="tog">−</span></div>
    <div class="sec-body">
      <select id="expMode">
        <option value="video">Video (BG + Logo)</option>
        <option value="greenscreen">Green Screen (square, no audio)</option>
      </select>
    </div>
  </div>

  <div class="divider"></div>
  <div class="cp-section" id="sec-bg">
    <div class="sec-hdr" onclick="toggleSec2('bg')"><span>Background</span><span class="tog">−</span></div>
    <div class="sec-body">
      <input type="file" id="bgFin" accept="image/*" style="display:none">
      <button class="p" onclick="document.getElementById('bgFin').click()">Choose Background PNG</button>
      <label>Brightness <span id="bgBrtV">100%</span></label>
      <input type="range" id="bgBrt" min="0" max="200" value="100" step="1">
      <label>Scale <span id="bgSclV">100%</span></label>
      <input type="range" id="bgScl" min="50" max="300" value="100" step="1">
    </div>
  </div>

  <div class="divider"></div>
  <div class="cp-section" id="sec-logo">
    <div class="sec-hdr" onclick="toggleSec2('logo')"><span>Logo</span><span class="tog">−</span></div>
    <div class="sec-body">
      <input type="file" id="logoFin" accept="image/*" style="display:none">
      <button class="p" onclick="document.getElementById('logoFin').click()">Choose Logo PNG</button>
      <label>Brightness <span id="logoBrtV">100%</span></label>
      <input type="range" id="logoBrt" min="0" max="200" value="100" step="1">
      <label>Size <span id="logoSclV">50%</span></label>
      <input type="range" id="logoScl" min="10" max="300" value="100" step="1">
      <label>Position X <span id="logoXV">28.5%</span></label>
      <input type="range" id="logoX" min="0" max="100" value="50" step="0.5">
      <label>Position Y <span id="logoYV">50%</span></label>
      <input type="range" id="logoY" min="0" max="100" value="50" step="0.5">
      <div class="row2">
        <button class="p" onclick="saveDefault('logo')">Save Default</button>
        <button class="p" onclick="resetDefault('logo')">Reset</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="cp-section" id="sec-circle">
    <div class="sec-hdr" onclick="toggleSec2('circle')"><span>Circle</span><span class="tog">−</span></div>
    <div class="sec-body">
      <label>Position X <span id="circXV">72.5%</span></label>
      <input type="range" id="circX" min="0" max="100" value="50" step="0.5">
      <label>Position Y <span id="circYV">50%</span></label>
      <input type="range" id="circY" min="0" max="100" value="50" step="0.5">
      <label>World Size <span id="circSclV">100%</span></label>
      <input type="range" id="circScl" min="20" max="300" value="100" step="1">
      <div class="row2">
        <button class="p" onclick="saveDefault('circle')">Save Default</button>
        <button class="p" onclick="resetDefault('circle')">Reset</button>
      </div>
    </div>
  </div>
</div>
<div id="cp2Tab" class="slide-tab" onclick="toggleCp2()">⟩</div>

<div id="fps">33 fps</div>
<div id="recStatus"></div>

attribute float aIdx;

uniform float uGX, uGY, uGZ, uSX, uSY, uSZ;
uniform float uSphR, uSphS, uFeat;
uniform float uDspAmt, uDspScl, uTime, uDspOn, uDspSign;
uniform float uBlendInt, uBlendViaGrid, uBlendOn;
uniform float uCam, uCRx, uSRx;
uniform float uCamOX, uCamOY, uZoom;
uniform float uFlowX, uFlowY, uFlowEvo;
uniform float uNoiseOffX, uNoiseOffY;
uniform float uFlipX, uFlipY;
uniform float uOctMult, uOctScl;
uniform int   uComplexity;
uniform float uFractalSum;   // 0 = Noise, 1 = Abs(Noise) — matches Trapcode's Fractal Sum popup
uniform float uOffsetEvo;    // Offset Evolution — seeds a different fractal map
uniform float uAffectSize, uAffectOpacity;
uniform float uBasePtSize;
uniform float uGamma, uNoiseMult, uOffset, uMinVal, uMaxVal;
uniform float uFinalAudio, uRadiusAudio;
uniform vec2  uRes;
uniform float uAlpha;

varying float vA;

// ── 4D Classical Perlin noise (cnoise) ───────────────────────────
// Ported directly from frag shader 1_frag.txt.
// Uses periodic rep = vec4(0) meaning no tiling (matches frag usage).
vec4 _mod289v4(vec4 x) { return x - floor(x*(1./289.))*289.; }
vec4 _perm(vec4 x)     { return _mod289v4(((x*34.)+1.)*x); }
vec4 _tisr(vec4 r)     { return 1.79284291400159 - 0.85373472095314*r; }
vec4 _fade4(vec4 t)    { return t*t*t*(t*(t*6.-15.)+10.); }

float cnoise4(vec4 P) {
  // no tiling: rep = large number effectively infinite
  vec4 Pi0 = floor(P);
  vec4 Pi1 = Pi0 + 1.0;
  Pi0 = _mod289v4(Pi0);
  Pi1 = _mod289v4(Pi1);
  vec4 Pf0 = fract(P);
  vec4 Pf1 = Pf0 - 1.0;
  vec4 ix = vec4(Pi0.x,Pi1.x,Pi0.x,Pi1.x);
  vec4 iy = vec4(Pi0.y,Pi0.y,Pi1.y,Pi1.y);
  vec4 iz0 = Pi0.zzzz, iz1 = Pi1.zzzz;
  vec4 iw0 = Pi0.wwww, iw1 = Pi1.wwww;

  vec4 ixy  = _perm(_perm(ix)+iy);
  vec4 ixy0 = _perm(ixy+iz0), ixy1 = _perm(ixy+iz1);
  vec4 ixy00=_perm(ixy0+iw0), ixy01=_perm(ixy0+iw1);
  vec4 ixy10=_perm(ixy1+iw0), ixy11=_perm(ixy1+iw1);

  vec4 gx00=ixy00/7., gy00=floor(gx00)/7., gz00=floor(gy00)/6.;
  gx00=fract(gx00)-.5; gy00=fract(gy00)-.5; gz00=fract(gz00)-.5;
  vec4 gw00=vec4(.75)-abs(gx00)-abs(gy00)-abs(gz00);
  vec4 sw00=step(gw00,vec4(0.)); gx00-=sw00*(step(0.,gx00)-.5); gy00-=sw00*(step(0.,gy00)-.5);

  vec4 gx01=ixy01/7., gy01=floor(gx01)/7., gz01=floor(gy01)/6.;
  gx01=fract(gx01)-.5; gy01=fract(gy01)-.5; gz01=fract(gz01)-.5;
  vec4 gw01=vec4(.75)-abs(gx01)-abs(gy01)-abs(gz01);
  vec4 sw01=step(gw01,vec4(0.)); gx01-=sw01*(step(0.,gx01)-.5); gy01-=sw01*(step(0.,gy01)-.5);

  vec4 gx10=ixy10/7., gy10=floor(gx10)/7., gz10=floor(gy10)/6.;
  gx10=fract(gx10)-.5; gy10=fract(gy10)-.5; gz10=fract(gz10)-.5;
  vec4 gw10=vec4(.75)-abs(gx10)-abs(gy10)-abs(gz10);
  vec4 sw10=step(gw10,vec4(0.)); gx10-=sw10*(step(0.,gx10)-.5); gy10-=sw10*(step(0.,gy10)-.5);

  vec4 gx11=ixy11/7., gy11=floor(gx11)/7., gz11=floor(gy11)/6.;
  gx11=fract(gx11)-.5; gy11=fract(gy11)-.5; gz11=fract(gz11)-.5;
  vec4 gw11=vec4(.75)-abs(gx11)-abs(gy11)-abs(gz11);
  vec4 sw11=step(gw11,vec4(0.)); gx11-=sw11*(step(0.,gx11)-.5); gy11-=sw11*(step(0.,gy11)-.5);

  vec4 g0000=vec4(gx00.x,gy00.x,gz00.x,gw00.x), g1000=vec4(gx00.y,gy00.y,gz00.y,gw00.y);
  vec4 g0100=vec4(gx00.z,gy00.z,gz00.z,gw00.z), g1100=vec4(gx00.w,gy00.w,gz00.w,gw00.w);
  vec4 g0010=vec4(gx10.x,gy10.x,gz10.x,gw10.x), g1010=vec4(gx10.y,gy10.y,gz10.y,gw10.y);
  vec4 g0110=vec4(gx10.z,gy10.z,gz10.z,gw10.z), g1110=vec4(gx10.w,gy10.w,gz10.w,gw10.w);
  vec4 g0001=vec4(gx01.x,gy01.x,gz01.x,gw01.x), g1001=vec4(gx01.y,gy01.y,gz01.y,gw01.y);
  vec4 g0101=vec4(gx01.z,gy01.z,gz01.z,gw01.z), g1101=vec4(gx01.w,gy01.w,gz01.w,gw01.w);
  vec4 g0011=vec4(gx11.x,gy11.x,gz11.x,gw11.x), g1011=vec4(gx11.y,gy11.y,gz11.y,gw11.y);
  vec4 g0111=vec4(gx11.z,gy11.z,gz11.z,gw11.z), g1111=vec4(gx11.w,gy11.w,gz11.w,gw11.w);

  vec4 n00=_tisr(vec4(dot(g0000,g0000),dot(g0100,g0100),dot(g1000,g1000),dot(g1100,g1100)));
  g0000*=n00.x; g0100*=n00.y; g1000*=n00.z; g1100*=n00.w;
  vec4 n01=_tisr(vec4(dot(g0001,g0001),dot(g0101,g0101),dot(g1001,g1001),dot(g1101,g1101)));
  g0001*=n01.x; g0101*=n01.y; g1001*=n01.z; g1101*=n01.w;
  vec4 n10=_tisr(vec4(dot(g0010,g0010),dot(g0110,g0110),dot(g1010,g1010),dot(g1110,g1110)));
  g0010*=n10.x; g0110*=n10.y; g1010*=n10.z; g1110*=n10.w;
  vec4 n11=_tisr(vec4(dot(g0011,g0011),dot(g0111,g0111),dot(g1011,g1011),dot(g1111,g1111)));
  g0011*=n11.x; g0111*=n11.y; g1011*=n11.z; g1111*=n11.w;

  float v0000=dot(g0000,Pf0);
  float v1000=dot(g1000,vec4(Pf1.x,Pf0.yzw));
  float v0100=dot(g0100,vec4(Pf0.x,Pf1.y,Pf0.zw));
  float v1100=dot(g1100,vec4(Pf1.xy,Pf0.zw));
  float v0010=dot(g0010,vec4(Pf0.xy,Pf1.z,Pf0.w));
  float v1010=dot(g1010,vec4(Pf1.x,Pf0.y,Pf1.z,Pf0.w));
  float v0110=dot(g0110,vec4(Pf0.x,Pf1.yz,Pf0.w));
  float v1110=dot(g1110,vec4(Pf1.xyz,Pf0.w));
  float v0001=dot(g0001,vec4(Pf0.xyz,Pf1.w));
  float v1001=dot(g1001,vec4(Pf1.x,Pf0.yz,Pf1.w));
  float v0101=dot(g0101,vec4(Pf0.x,Pf1.y,Pf0.z,Pf1.w));
  float v1101=dot(g1101,vec4(Pf1.xy,Pf0.z,Pf1.w));
  float v0011=dot(g0011,vec4(Pf0.xy,Pf1.zw));
  float v1011=dot(g1011,vec4(Pf1.x,Pf0.y,Pf1.zw));
  float v0111=dot(g0111,vec4(Pf0.x,Pf1.yzw));
  float v1111=dot(g1111,Pf1);

  vec4 fw=_fade4(Pf0);
  vec4 n0w=mix(vec4(v0000,v1000,v0100,v1100),vec4(v0001,v1001,v0101,v1101),fw.w);
  vec4 n1w=mix(vec4(v0010,v1010,v0110,v1110),vec4(v0011,v1011,v0111,v1111),fw.w);
  vec4 nzw=mix(n0w,n1w,fw.z);
  vec2 nyw=mix(nzw.xy,nzw.zw,fw.y);
  return 2.2*mix(nyw.x,nyw.y,fw.x);
}

// ── fBm with 4D flow vector — Fractal Sum ──────────────────────
// Trapcode Fractal Sum popup: "Noise" sums signed layers (smooth look),
// "Abs(Noise)" takes abs() of each layer before summing (sharp ridges).
//
// Optimization: nx/ny/nz all share the same xyz position, flow vector,
// and per-octave frequency — only the w-coordinate differs between them.
// Originally this ran 3 fully separate loops (3x the octave count worth
// of redundant "p+flow*uTime" and freq-scaling work). This single shared
// loop computes all 3 axes together, reusing that per-octave work, which
// matters a lot at higher Complexity values across a 90k-vertex grid
// every frame. Numerically identical output to 3 separate calls.
vec3 octaveNoise3(vec3 p, vec4 flow, float w0, float w1, float w2) {
  vec3 val = vec3(0.);
  float freq = 1.;
  float ft = flow.w * uTime; // flow evolution term, shared across all 3 axes
  for (int i=0; i<8; i++) {
    if (i >= uComplexity) break;
    vec3 pf = (p + flow.xyz*uTime) * freq; // shared xyz+flow term this octave
    float wf = (ft) * freq;                 // matches original (w+flow.w*t)*freq structure at w=0
    float nx = cnoise4(vec4(pf, (w0*freq) + wf));
    float ny = cnoise4(vec4(pf, (w1*freq) + wf));
    float nz = cnoise4(vec4(pf, (w2*freq) + wf));
    vec3 n = vec3(nx, ny, nz);
    val += (uFractalSum > 0.5) ? abs(n) : n;
    freq *= uOctScl;
  }
  return val / float(uComplexity);
}

// ── fbm3() — true 4D displacement, matching Trapcode's 3D+time noise ──
// Trapcode's Fractal field samples one 4D noise space (3D position + an
// evolution/time axis), not 3 independent fields. Each axis here samples
// the SAME xyz position and SAME flow vector — only the w (4th/time-style)
// coordinate is offset per axis, so the three components stay correlated
// in space and motion (giving the flowing look) while still being distinct
// enough to not move identically.
vec3 fbm3(vec4 p, vec4 flow) {
  float sc = uDspScl * 0.003;
  vec3 sp = sc * p.xyz;

  vec3 c = octaveNoise3(sp, flow, uOffsetEvo, uOffsetEvo + 37.2, uOffsetEvo + 91.7);

  vec3 oN = uFinalAudio * c;
  oN = clamp(oN, vec3(uMinVal), vec3(uMaxVal));

  vec3 signed_ = sign(oN);
  vec3 absN = abs(oN);
  vec3 gammaN = signed_ * pow(absN, vec3(uGamma));

  return uOffset + uNoiseMult * gammaN;
}

void main() {
  float ps = uGX * uGY;
  float iz = floor(aIdx/ps), rm = mod(aIdx,ps), ix = mod(rm,uGX), iy = floor(rm/uGX);
  float px = (uGX>1. ? ix/(uGX-1.)-.5 : 0.) * uSX;
  float py = (uGY>1. ? iy/(uGY-1.)-.5 : 0.) * uSY;
  float pz = (uGZ>1. ? iz/(uGZ-1.)-.5 : 0.) * uSZ;

  // Mirror the sampling coordinate like flipping an image — this flips
  // *where* the noise field is read from (not just the output sign), so
  // the whole pattern mirrors, same as flipping an image horizontally
  // or vertically.
  float fx = uFlipX > 0.5 ? -px : px;
  float fy = uFlipY > 0.5 ? -py : py;

  // 4D particle coord — w = 0 (or could be iz for 3D grids). Noise offset
  // pans the sample point through the noise field independent of the flip.
  vec4 p4 = vec4(fx + uNoiseOffX, fy + uNoiseOffY, pz, 0.0);

  // Single shared flow vector — curl noise needs one coherent field, not
  // three permuted ones, so all axes evolve through the same flow.
  vec4 flow = vec4(uFlowX, uFlowY, 0., uFlowEvo) * 0.001;

  float ds = uDspSign * uDspOn;
  // XYZ Linked (confirmed via official Red Giant tutorial transcript):
  // Trapcode Form applies ONE Displace amount uniformly to all three
  // axes in this mode — no per-axis weighting. The three noise
  // components already differ via their w-offset in fbm3(), so the look
  // stays varied without an artificial Z scale-down.
  vec3 disp = fbm3(p4, flow) * uDspAmt;
  px += ds * disp.x;
  py += ds * disp.y;
  pz += ds * disp.z;

  // Sphere field — radius driven by audioRadius uniform
  float R = uSphR + uRadiusAudio;
  float d = sqrt(px*px+py*py+pz*pz);
  if (d>0. && d<R) {
    float fz=R*uFeat, ie=R-fz, w=1.;
    if (d>ie){float t=clamp((d-ie)/fz,0.,1.);w=.5*(1.+cos(t*3.14159265));}
    float inv=1./d;
    px+=((px*inv)*R-px)*uSphS*w;
    py+=((py*inv)*R-py)*uSphS*w;
    pz+=((pz*inv)*R-pz)*uSphS*w;
  }

  float ry=py*uCRx-pz*uSRx, rz=py*uSRx+pz*uCRx;
  float sc2=uCam/(uCam+rz+600.);
  gl_Position=vec4((px*sc2*uZoom)/(uRes.x*.5) + uCamOX, -(ry*sc2*uZoom)/(uRes.y*.5) + uCamOY, 0., 1.);

  // size no longer scales with displace/audio — fixed at base point size
  float sz = uBasePtSize;
  gl_PointSize = sz * sc2;

  // affectOpacity: modulated by finalAudio
  float opMod = mix(1.0, 0.3 + 0.7*clamp(abs(uFinalAudio),0.,1.), clamp(uAffectOpacity,0.,1.) * uDspOn);
  float ga = clamp(uAlpha*sc2*uBlendInt*opMod, 0., .85);
  float fa = clamp(uAlpha*uBlendInt*opMod, 0., .85);
  vA = mix(uAlpha*opMod, mix(fa, ga, uBlendViaGrid), uBlendOn);
}`;

const FS = `precision mediump float;
uniform vec3 uCol;
varying float vA;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float r = dot(c,c) * 4.;
  float a = vA * (1. - smoothstep(0.5, 1.0, r));
  gl_FragColor = vec4(uCol * a, a);
}`;

function mkS(t, src) {
  const s = gl.createShader(t);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const pr = gl.createProgram();
gl.attachShader(pr, mkS(gl.VERTEX_SHADER, VS));
gl.attachShader(pr, mkS(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error('Link:', gl.getProgramInfoLog(pr));
gl.useProgram(pr);

const GX = CFG.gridX, GY = CFG.gridY, GZ = CFG.gridZ, N = GX * GY * GZ;
const idxArr = new Float32Array(N);
for (let i = 0; i < N; i++) idxArr[i] = i;
const vbuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
gl.bufferData(gl.ARRAY_BUFFER, idxArr, gl.STATIC_DRAW);
const ai = gl.getAttribLocation(pr, 'aIdx');
gl.enableVertexAttribArray(ai);
gl.vertexAttribPointer(ai, 1, gl.FLOAT, false, 0, 0);

const U = {};
('uGX uGY uGZ uSX uSY uSZ uSphR uSphS uFeat uDspAmt uDspScl uTime uDspOn uDspSign ' +
 'uBlendInt uBlendViaGrid uBlendOn uCam uCRx uSRx uCamOX uCamOY uZoom uFlowX uFlowY uFlowEvo ' +
 'uNoiseOffX uNoiseOffY uFlipX uFlipY uFractalSum uOffsetEvo ' +
 'uOctMult uOctScl uComplexity uAffectSize uAffectOpacity uBasePtSize ' +
 'uGamma uNoiseMult uOffset uMinVal uMaxVal ' +
 'uFinalAudio uRadiusAudio uRes uAlpha uCol')
.split(' ').forEach(n => U[n] = gl.getUniformLocation(pr, n));

// ── Colour ────────────────────────────────────────────────────
let colR = 0, colG = 180, colB = 255;
let hueBrightness = 45;
const hslEl = document.getElementById('hsl'), csw = document.getElementById('csw');
const brtEl = document.getElementById('brt');
function hslRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255|0,f(8)*255|0,f(4)*255|0];}
function updCol(){
  hueBrightness = +brtEl.value;
  [colR,colG,colB]=hslRgb(+hslEl.value,80,hueBrightness);
  csw.style.background=`hsl(${hslEl.value},80%,${hueBrightness}%)`;
}
hslEl.addEventListener('input', updCol);
brtEl.addEventListener('input', updCol);
updCol();
function setWhite(){colR=colG=colB=255;csw.style.background='#fff';}

// ── Palette swatches ──────────────────────────────────────────
const PALETTES = [
  { name:'Yellow',  h:60,  l:50 },
  { name:'Cyan',    h:190, l:50 },
  { name:'Blue',    h:220, l:55 },
  { name:'LtGreen', h:100, l:50 },
  { name:'Green',   h:130, l:40 },
  { name:'DkBlue',  h:240, l:40 },
  { name:'Red',     h:0,   l:50 },
  { name:'Purple',  h:280, l:50 },
  { name:'Orange',  h:30,  l:50 },
  { name:'White',   h:0,   l:95, s:0 },
  { name:'Black',   h:0,   l:8,  s:0 },
];
let activeSwatch = null;
const palContainer = document.getElementById('palettes');
PALETTES.forEach((p, i) => {
  const sw = document.createElement('div');
  sw.className = 'pal-swatch' + (i === 0 ? ' active' : '');
  const s = p.s !== undefined ? p.s : 80;
  sw.style.background = `hsl(${p.h},${s}%,${p.l}%)`;
  sw.title = p.name;
  if (i === 0) activeSwatch = sw;
  sw.addEventListener('click', () => {
    if (activeSwatch) activeSwatch.classList.remove('active');
    sw.classList.add('active');
    activeSwatch = sw;
    const ss = p.s !== undefined ? p.s : 80;
    if (ss === 0) { colR=colG=colB = Math.round(p.l/100*255); csw.style.background=`hsl(0,0%,${p.l}%)`; }
    else { [colR,colG,colB]=hslRgb(p.h,ss,p.l); csw.style.background=`hsl(${p.h},${ss}%,${p.l}%)`; }
    hslEl.value = p.h; brtEl.value = p.l; hueBrightness = p.l;
  });
  palContainer.appendChild(sw);
});

const expModeSel = document.getElementById('expMode');

// Extracted so the GitHub headless-render bootstrap can feed in files
// programmatically (fetched from the repo) using the exact same logic
// the manual file pickers use.
function applyBgFile(f){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { CFG.layout.bg.img = img; resolve(); };
    img.src = URL.createObjectURL(f);
  });
}
function applyLogoFile(f){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { CFG.layout.logo.img = img; resolve(); };
    img.src = URL.createObjectURL(f);
  });
}
document.getElementById('bgFin').addEventListener('change', function(e){
  const f = e.target.files[0]; if (!f) return;
  applyBgFile(f);
});
document.getElementById('logoFin').addEventListener('change', function(e){
  const f = e.target.files[0]; if (!f) return;
  applyLogoFile(f);
});

function bindRange(id, valId, fmt, onInput) {
  const el = document.getElementById(id), valEl = document.getElementById(valId);
  el.addEventListener('input', () => { valEl.textContent = fmt(+el.value); onInput(+el.value); });
}
bindRange('bgBrt', 'bgBrtV', v => v + '%', v => CFG.layout.bg.brightness = v / 100);
bindRange('bgScl', 'bgSclV', v => v + '%', v => CFG.layout.bg.scale = v / 100);
bindRange('logoBrt', 'logoBrtV', v => v + '%', v => CFG.layout.logo.brightness = v / 100);
bindRange('logoScl', 'logoSclV', v => v + '%', v => CFG.layout.logo.scale = v / 100);
bindRange('logoX', 'logoXV', v => v + '%', v => CFG.layout.logo.x = v);
bindRange('logoY', 'logoYV', v => v + '%', v => CFG.layout.logo.y = v);
bindRange('circX', 'circXV', v => v + '%', v => CFG.layout.circle.x = v);
bindRange('circY', 'circYV', v => v + '%', v => CFG.layout.circle.y = v);
bindRange('circScl', 'circSclV', v => v + '%', v => CFG.layout.circle.worldSize = v / 100);

// Position/scale defaults — persisted in localStorage (this is a standalone
// local HTML file, not a claude.ai artifact, so localStorage is fine here).
const DEFAULTS_KEY = 'ncsCircleLayoutDefaults';
function loadDefaults() {
  try { return JSON.parse(localStorage.getItem(DEFAULTS_KEY)) || {}; } catch(e) { return {}; }
}
function writeDefaults(patch) {
  const d = loadDefaults();
  localStorage.setItem(DEFAULTS_KEY, JSON.stringify({ ...d, ...patch }));
}
function saveDefault(which) {
  if (which === 'logo') {
    writeDefaults({ logo: { brightness: CFG.layout.logo.brightness, scale: CFG.layout.logo.scale, x: CFG.layout.logo.x, y: CFG.layout.logo.y } });

// ── Shared compositor — draws one export frame (background + circle +
// logo, or greenscreen) into any target canvas at any resolution. Used
// both by the live preview canvas (prevC) and the recording capture
// canvas (recC), so what you see in the preview is exactly what gets
// recorded.
function renderExportFrame(tctx, cw, ch) {
  const lay = CFG.layout;
  tctx.clearRect(0, 0, cw, ch);

  if (lay.mode === 'greenscreen') {
    tctx.fillStyle = '#00FF00';
    tctx.fillRect(0, 0, cw, ch);
  } else {
    if (lay.bg.img) {
      tctx.save();
      if (lay.bg.brightness !== 1) tctx.filter = `brightness(${lay.bg.brightness})`;
      const img = lay.bg.img;
      const baseScale = Math.max(cw / img.width, ch / img.height); // cover-fit
      const s = baseScale * lay.bg.scale;
      const iw = img.width * s, ih = img.height * s;
      tctx.drawImage(img, (cw - iw) / 2, (ch - ih) / 2, iw, ih);
      tctx.restore();
    } else {
      tctx.fillStyle = '#000';
      tctx.fillRect(0, 0, cw, ch);
    }
  }

  // Circle layer — centered-square crop of the live `out` canvas (already
  // includes glow). In video mode, positioned/scaled by circle x/y/worldSize
  // for placement over the background. In green screen mode, position/scale
  // don't apply — you're keying it out in an editor anyway, so it just fills
  // the full square like a plain export.
  const srcSide = Math.min(out.width, out.height);
  const sx = (out.width - srcSide) / 2, sy = (out.height - srcSide) / 2;
  if (lay.mode === 'video') {
    const baseSide = Math.min(cw, ch);
    const side = baseSide * lay.circle.worldSize;
    const ccx = cw * (lay.circle.x / 100), ccy = ch * (lay.circle.y / 100);
    tctx.drawImage(out, sx, sy, srcSide, srcSide, ccx - side / 2, ccy - side / 2, side, side);
  } else {
    tctx.drawImage(out, sx, sy, srcSide, srcSide, 0, 0, cw, ch);
  }

  if (lay.mode === 'video' && lay.logo.img) {
    tctx.save();
    if (lay.logo.brightness !== 1) tctx.filter = `brightness(${lay.logo.brightness})`;
    const img = lay.logo.img;
    const lw = img.width * lay.logo.scale, lh = img.height * lay.logo.scale;
    const lcx = cw * (lay.logo.x / 100), lcy = ch * (lay.logo.y / 100);
    tctx.drawImage(img, lcx - lw / 2, lcy - lh / 2, lw, lh);
    tctx.restore();
  }
}

// ── Audio ─────────────────────────────────────────────────────
// Single full-waveform loudness meter — same algorithm as the
// audio-reactor-2.html demo's "Loudness (wave)" mode: byte time-domain
// data, RMS of (v-128)/128. One signal feeds both reactors now (matching
// the demo, where one pulse drives everything); each reactor still has
// its own sensitivity/compensation so radius and displace can be tuned
// independently off that same signal.
let audioCtx = null, audioStream = null;
let currentAudioFile = null, currentAudioEl = null;
let analyser = null, timeData = null, fdata = null;
let smoothRadius = null, smoothDisplace = 0, smoothFinalAudio = 0;

// RMS loudness (0-1) straight off the raw waveform — identical math to
// getLoudness() in audio-reactor-2.html.
// Pure RMS-from-time-domain-bytes math — used by both the live getLoudness()
// (below) and the offline precompute pass (renderLockedOffline()).
function loudnessFromTimeData(bytes){
  let sumSquares = 0;
  for (let i = 0; i < bytes.length; i++){
    const v = (bytes[i] - 128) / 128;
    sumSquares += v * v;
  }
  return Math.sqrt(sumSquares / bytes.length);
}
function getLoudness(){
  if (!analyser || !timeData) return 0;
  analyser.getByteTimeDomainData(timeData);
  return loudnessFromTimeData(timeData);
}

// Self-compensating gain: raw RMS × sensitivity × shared loudnessScale,
// but as sensitivity climbs, each extra point buys progressively less
// gain (effSens approaches 1/compensation instead of growing forever).
// No hard ceiling — a hot signal at high sensitivity can still push past
// 1.0 for extra size/displace headroom, it just won't run away.
//
// curvePower (default 1.0 = old behavior) raises sensitivity to a power
// before the compensation divide: >1 gives a curved-low start (quieter
// gain at low sensitivity than before) that climbs steeper/higher than
// the old near-linear-then-flat shape as sensitivity increases.
function compensatedGain(rms, sensitivity, compensation, curvePower = 1.0){
  const s = Math.pow(sensitivity, curvePower);
  const effSens = s / (1 + compensation * s);
  return rms * CFG.audio.loudnessScale * effSens;
}

// Once `gain` crosses 1.0, re-compensates only the excess above 1.0 using
// a plain flat 1/(1+c*excess) curve — independent of whatever compensation
// shaped the value below 1.0. Below 1.0 (or when disabled), returns gain
// unchanged.
function applyOverflowCompensation(gain, oc){
  if (!oc || !oc.enabled || gain <= 1.0) return gain;
  const excess = gain - 1.0;
  return 1.0 + excess / (1 + oc.compensation * excess);
}

// Pure band-RMS-from-frequency-bytes math — used by both the live bandRMS()
// (below) and the offline precompute pass.
function bandRMSFromFreqData(bytes, sampleRate, freqHz, widthHz){
  const nyq = sampleRate / 2;
  const len = bytes.length;
  const fMin = Math.max(0, freqHz - widthHz);
  const fMax = freqHz + widthHz;
  const a = Math.max(0, Math.floor(fMin / nyq * len));
  const b = Math.min(Math.ceil(fMax / nyq * len), len - 1);
  let s = 0, c = 0;
  for (let i = a; i <= b; i++){ s += bytes[i] * bytes[i]; c++; }
  return c > 0 ? Math.sqrt(s / c) / 255 : 0;
}
// Band RMS (0-1) over a Hz range, read off the frequency-domain data —
// used by reactor2 (displace) so it can react to its own slice of the
// spectrum (CFG.audio.reactor2Freq ± reactor2Width) instead of sharing
// the same wideband loudness signal reactor1 (radius) uses.
function bandRMS(freqHz, widthHz){
  if (!analyser || !fdata) return 0;
  analyser.getByteFrequencyData(fdata);
  return bandRMSFromFreqData(fdata, analyser.context.sampleRate, freqHz, widthHz); // live sampleRate — correct for BT devices
}

// Extracted so the GitHub headless-render bootstrap can load a fetched
// audio file the exact same way the manual file picker does. `headless`
// skips el.play()/Auto-Rec (autoplay is unreliable/unnecessary in a

// since renderLockedOffline() needs that.
function applyAudioFile(f, headless){
  return new Promise((resolve) => {
    currentAudioFile = f;
    if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl.src = ''; }

    analyser = audioCtx.createAnalyser();

    src.connect(audioCtx.destination);

// Eases `current` toward `target`, using a faster coefficient on the rise
// and a slower one on the fall — reads as punch-in/settle-out rather than
// uniform lag in both directions.
function easeToward(current, target, attack, release){
  const coeff = target > current ? attack : release;
  return current + (target - current) * coeff;
}

// ── Sphere1 boosters ─────────────────────────────────────────────
// Per-instance state for the boost multiplier — starts at the full
// sphereaudiob amount and decays only while the boosted value is over
// sphereVl. Floors at 0; never goes negative. The further over the limit
// the boosted value is, the harder it decays per frame — spheredc acts
// as a rate on that overshoot rather than a flat step. Recovery is the
// opposite: once back under the limit, the boost just eases back toward
// full strength at a flat step (no overshoot to scale off of there —
// "going back just makes the boost go back to normal").
// State lives on the cfg object itself (cfg._currentBoost) so Size and
// Displace, each passing their own cfg, get fully independent state —
// one crossing its limit never affects the other.
function sphere1Boost(value, cfg){
  if (cfg._currentBoost === undefined || cfg._currentBoost === null) {
    cfg._currentBoost = cfg.sphereaudiob;
  }

  // Candidate output using this frame's current boost amount.
  const boosted = value * (1 + cfg._currentBoost);

  if (boosted > cfg.sphereVl) {
    // Over the limit — decay scales with how far over it is. Overshoot
    // is normalized against the limit itself so spheredc behaves
    // similarly regardless of what sphereVl is set to (e.g. a limit of
    // 20 and a limit of 200 both feel the same at "50% over").
    const overshoot = (boosted - cfg.sphereVl) / cfg.sphereVl;
    const step = cfg.spheredc * (1 + overshoot);
    cfg._currentBoost = Math.max(0, cfg._currentBoost - step);
  } else if (cfg._currentBoost < cfg.sphereaudiob) {
    // Back under the limit — flat step back up toward full strength,
    // no scaling — it just returns to normal.
    cfg._currentBoost = Math.min(cfg.sphereaudiob, cfg._currentBoost + cfg.spheredc);
  }

  if (!cfg.sphereTd) {
    // Compensation/decay tracked internally only — output always reflects
    // the un-decayed full boost amount.
    return value * (1 + cfg.sphereaudiob);
  }

  // sphereTd true — decayed boost actually shrinks the output value.
  return value * (1 + cfg._currentBoost);
}

// Pure reactor math — same formulas updateAudio() always used, factored out
// so the offline "Locked Render" path (below) can drive the exact same
// audio-reactive behavior from precomputed values instead of a live analyser.
function computeReactorTargets(ac, loud, displaceLoud){
  const r1 = displaceLoud * ac.loudnessScale * ac.reactor2Sensitivity; // displace: sensitivity only
  const r2 = compensatedGain(loud, ac.reactor1Sensitivity, ac.reactor1Compensation, ac.reactor1CurvePower); // → sphere radius
  let targetRadius = ac.reactor1RadiusMin + r2 * ac.reactor1RadiusAdd;
  targetRadius = sphere1Boost(targetRadius, ac.sphere1Size); // radius/size only — displace no longer boosted
  const targetDisplace = CFG.displace.amount * r1;
  const targetReactor = r1; // feeds uFinalAudio (curl noise scale)
  return { targetRadius, targetDisplace, targetReactor };
}

// One smoothing step toward given targets (or resting values if audio is
// disabled). state = {radius, displace, finalAudio}, mutated in place and
// returned. This is frame-count-based, not wall-clock-based (attack/release
// and `smooth` are both flat per-call coefficients) — so calling it once per
// real frame (live) or once per virtual 1/60s frame (offline) reproduces
// identical easing behavior either way.
function stepReactorSmoothing(state, ac, targets){
  const ar = ac.attackRelease;
  if (state.radius === null) state.radius = targets.targetRadius;
  if (ar && ar.enabled) {
    state.radius      = easeToward(state.radius,      targets.targetRadius,   ar.attack, ar.release);
    state.displace     = easeToward(state.displace,     targets.targetDisplace, ar.attack, ar.release);
    state.finalAudio    = easeToward(state.finalAudio,   targets.targetReactor,  ar.attack, ar.release);
  } else {
    const sm = 1 - (ac.smooth ?? 0);
    state.radius       += (targets.targetRadius   - state.radius)     * sm;
    state.displace      += (targets.targetDisplace  - state.displace)   * sm;
    state.finalAudio     += (targets.targetReactor   - state.finalAudio) * sm;
  }
  return state;
}

function updateAudio() {
  if (!analyser) return;
  const ac = CFG.audio;
  const ar = ac.attackRelease;

  if (!ac.enabled) {
    // Master toggle off — relax back to resting values instead of snapping,
    // so flipping it mid-playback doesn't pop.
    if (smoothRadius === null) smoothRadius = ac.reactor1RadiusMin;
    const state = { radius: smoothRadius, displace: smoothDisplace, finalAudio: smoothFinalAudio };
    stepReactorSmoothing(state, ac, { targetRadius: ac.reactor1RadiusMin, targetDisplace: 0, targetReactor: 0 });
    smoothRadius = state.radius; smoothDisplace = state.displace; smoothFinalAudio = state.finalAudio;
    return;
  }

  const loud = getLoudness(); // wideband loudness — drives reactor1 (radius), and reactor2 in mode 1
  const displaceLoud = ac.reactor2Mode === 2 ? bandRMS(ac.reactor2Freq, ac.reactor2Width) : loud;
  const targets = computeReactorTargets(ac, loud, displaceLoud);

  const state = { radius: smoothRadius, displace: smoothDisplace, finalAudio: smoothFinalAudio };
  stepReactorSmoothing(state, ac, targets);
  smoothRadius = state.radius; smoothDisplace = state.displace; smoothFinalAudio = state.finalAudio;
}

// Recording capture canvas — capped at 1080p regardless of the live dpr=3
// render resolution. captureStream() always grabs the source canvas at its
// native pixel size, and at dpr=3 that's ~9x the pixels of a 1x canvas —
// expensive for the live readback/encode path. We draw the full-res `out`
// canvas down into this fixed 1080p canvas every recorded frame and only
// capture/encode from there, so recording stays cheap no matter how high
// the live display resolution is. (recC/recCtx/REC_MAX_H declared earlier,
// next to glowC, so they exist before the first resize() call.)
let recDrawHandle = null;

  if (CFG.layout.mode === 'video') {
    recC.width = 1920;
    recC.height = 1080;
  } else {
    const side = Math.min(REC_MAX_H, out.width, out.height);
    recC.width = side;
    recC.height = side;
  }
}

function startRecDrawLoop() {
  sizeRecCanvas();

    if (!recording) return;

    // Keep the live capture path lightweight. captureStream samples the
    // canvas after the browser presents it; forcing gl.finish() and a
    // getImageData() readback here stalls the GPU/CPU pipeline and is what
    // causes the real-time recorder to collapse to a few FPS on mobile.
    renderExportFrame(recCtx, recC.width, recC.height);

// ffmpeg.wasm loader — single-pass mp4 encode, no manual frame seeking/re-encoding.
// Much lighter than the old VideoEncoder+Mp4Muxer frame-by-frame seek loop.
async function tryFfmpeg(){
